[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coqpit-config"
version = "0.2.6"
description = "Simple (maybe too simple), light-weight config management through python data-classes."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Eren Gölge", email = "egolge@coqui.ai"}
]
maintainers = [
    {name = "Enno Hermann", email = "enno.hermann@gmail.com"}
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "typing_extensions>=4.10",
]

[dependency-groups]
dev = [
    "coverage>=7",
    "prek>=0.5",
    "pytest>=9",
    "ruff==0.17.1",
    "ty==0.0.89",
]

[project.urls]
Repository = "https://github.com/idiap/coqui-ai-coqpit"
Issues = "https://github.com/idiap/coqui-ai-coqpit/issues"

[tool.uv]
required-version = ">=0.5.0"

[tool.hatch.build]
exclude = [
    "/.github",
    "/.gitignore",
    "/prek.toml",
    "/Makefile",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["coqpit"]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true

[tool.coverage.run]
source = ["coqpit", "tests"]
command_line = "-m pytest -W error"

[tool.ruff]
line-length = 120
lint.select = ["ALL"]
lint.ignore = [
    "ANN401",
    "CPY001",
    "D104",
    "FIX",
    "TD",
]
lint.preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",
    "FA100",
    "FBT001",
    "PLC2701",
    "PLR2004",
    "S101",
    "SLF001",
    "T201",
]
